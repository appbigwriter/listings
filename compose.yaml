services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PRELISTING_AUTH_MODE: supabase-session
      PRELISTING_ALLOW_LOCAL_ONLY: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["./node_modules/.bin/tsx", "scripts/catalog-worker.ts"]
    stop_grace_period: 60s
